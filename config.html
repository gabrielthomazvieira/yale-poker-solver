<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Customize Input File</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Inter', system-ui, sans-serif;
      padding: 20px;
    }
    .config-container {
      max-width: 550px;
      margin: 0 auto;
    }
    .config-item {
      margin-bottom: 15px;
    }
    .config-item label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .config-item input {
      width: 100%;
      padding: 8px;
      border: 1px solid #444;
      border-radius: 4px;
      background-color: #2a2a2a;
      color: #e0e0e0;
    }
    .apply-config-btn {
      background: #007acc;
      border: none;
      color: #fff;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 20px;
    }
    .apply-config-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }
    .apply-config-btn:active {
      transform: translateY(0);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="config-container">
    <h2>Customize Input File</h2>
    <form id="config-form">
      <!-- Configuration items will be populated here dynamically -->
    </form>
    <button class="apply-config-btn" id="apply-config-btn">Apply Configurations</button>
  </div>
  <script src="config.js"></script>
</body>
</html>
