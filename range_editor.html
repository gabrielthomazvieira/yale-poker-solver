<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Range Editor</title>
    <link rel="stylesheet" href="range_editor.css">
</head>
<body>
    <div id="range-editor-container">
        <div id="range-grid"></div>
        <div id="frequency-popup" style="display: none; position: absolute; background-color: #333; border: 1px solid #555; padding: 10px; border-radius: 5px; z-index: 1001;">
            <label for="frequency-input">Frequency (%):</label>
            <input type="number" id="frequency-input" min="0" max="100" step="0.1" style="width: 60px;">
            <button id="frequency-apply">Apply</button>
            <button id="frequency-cancel">Cancel</button>
        </div>
        <div id="controls">
             <p>Left-click: Toggle 100%/0% | Right-click: Set Frequency | Shift+Click: Select Range</p>
             <button id="apply-range">Apply Changes</button>
             <button id="close-editor">Close</button>
        </div>
    </div>
    <script src="range_editor.js"></script>
</body>
</html>
